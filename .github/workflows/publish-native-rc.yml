name: Publish immutable native SDK RC
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed SHA of current main
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: live-interaction-native-rc
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'onedayonemasterpiece/live-interaction' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Require exact committed main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          node -e 'const p=require("./package.json");if(!/^0\.4\.0-rc\.[0-9]+$/.test(p.version))process.exit(1)'
      - name: Produce checksum-verified archive
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          node scripts/pack-release.mjs "$RUNNER_TEMP/sdk"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"sdk"
          r=json.loads((root/"release.json").read_text())
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          assert r["commit"]==sha
          archive=pathlib.Path(r["archive"])
          data=archive.read_bytes()
          assert archive.parent==root and len(data)<8*1024*1024
          assert hashlib.sha256(data).hexdigest()==r["sha256"]
          with tarfile.open(archive,"r:gz") as tar:
              members=tar.getmembers()
              assert len(members)<1024 and sum(m.size for m in members)<32*1024*1024
              assert all((m.isfile() or m.isdir()) and m.name.startswith("package/") and ".." not in pathlib.PurePosixPath(m.name).parts for m in members)
              names={m.name for m in members if m.isfile()}
              assert {"package/package.json","package/browser/client.js","package/python/live_interaction/__init__.py","package/android/platform/src/main/java/org/onedayonemasterpiece/live/platform/NativeEncoder.java"}<=names
          r.update({"archive":archive.name,"archive_bytes":len(data),"tree":tree,"schema":"shared-sdk-candidate/v1"})
          (root/"release.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          (root/"package-inspection.json").write_text(json.dumps({"version":r["version"],"source_sha":sha,"source_tree":tree,"archive":archive.name,"sha256":r["sha256"],"bytes":len(data),"files":len(members)},indent=2,sort_keys=True)+"\n")
          print("Packed",r["version"],r["sha256"],len(data))
          PY
      - name: Verify exact-source contracts
        run: |
          npm test
          python -m pip install -e '.[audio]'
          npm run test:python
          gradle --no-daemon -p android test
      - name: Publish prerelease without overwriting tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo onedayonemasterpiece/live-interaction >/dev/null 2>&1; then
            echo "Existing release; refusing mutable overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" "$RUNNER_TEMP/sdk/"*.tgz \
            "$RUNNER_TEMP/sdk/release.json" "$RUNNER_TEMP/sdk/package-inspection.json" \
            --repo onedayonemasterpiece/live-interaction --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Live interaction $VERSION" \
            --notes "Candidate SDK built from exact main commit $GITHUB_SHA; Android handset validation is separate."
      - name: Redownload and compare published archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download "v$VERSION" --repo onedayonemasterpiece/live-interaction \
            --pattern '*.tgz' --dir "$RUNNER_TEMP/readback"
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"sdk/release.json").read_text())
          got=(root/"readback"/r["archive"]).read_bytes()
          assert len(got)==r["archive_bytes"]
          assert hashlib.sha256(got).hexdigest()==r["sha256"]
          print("Published archive SHA-256 verified",r["sha256"])
          PY
